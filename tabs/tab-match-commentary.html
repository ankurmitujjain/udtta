<section class="tab-pane space-y-6" id="pane-match-commentary">
<!-- Match Selector Header & Interactive Controls -->
<div class="glass-panel-elevated rounded-2xl p-5 sm:p-6 border-cyan-500/30 space-y-4">
<div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
<div>
<div class="flex items-center gap-2">
<span class="badge-pill bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">ELITE COACHING AUDIT</span>
<span class="text-xs font-mono text-slate-400">Modular Runtime Commentary</span>
</div>
<h3 class="text-lg font-bold text-white mt-1">Second-by-Second Video Commentary &amp; Tactical Feed</h3>
<p class="text-xs text-slate-300 mt-0.5">Point-by-point breakdown with exact duration intervals, technical execution critiques, and direct YouTube video launch buttons (-2s lead time).</p>
</div>
<!-- Match Selector Pills -->
<div class="flex items-center gap-2 bg-slate-950/80 p-1.5 rounded-xl border border-slate-800 flex-shrink-0">
<button class="match-subtab active px-3 py-1.5 rounded-lg text-xs font-semibold transition border border-transparent" id="matchBtn-Y" onclick="selectCommentaryMatch('Y')">
              Match Y (Yellow • 7:16)
            </button>
<button class="match-subtab px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition border border-transparent" id="matchBtn-G1" onclick="selectCommentaryMatch('G1')">
              Match G1 (Green • 1:32)
            </button>
<button class="match-subtab px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition border border-transparent" id="matchBtn-G2" onclick="selectCommentaryMatch('G2')">
              Match G2 (Green • 5:02)
            </button>
</div>
</div>
<!-- Filter Bar -->
<div class="pt-3 border-t border-slate-800/80 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-xs">
<div class="flex flex-wrap items-center gap-2">
<span class="text-slate-400 font-medium">Filter Plays:</span>
<button class="px-2.5 py-1 rounded-md bg-blue-600 text-white font-semibold" id="filter-all" onclick="filterCommentary('all')">All Plays</button>
<button class="px-2.5 py-1 rounded-md bg-slate-900 text-emerald-400 hover:bg-slate-800 border border-emerald-500/30" id="filter-good" onclick="filterCommentary('good')">Good Execution</button>
<button class="px-2.5 py-1 rounded-md bg-slate-900 text-rose-400 hover:bg-slate-800 border border-rose-500/30" id="filter-error" onclick="filterCommentary('error')">Errors &amp; Vulnerabilities</button>
<button class="px-2.5 py-1 rounded-md bg-slate-900 text-amber-400 hover:bg-slate-800 border border-amber-500/30" id="filter-serve" onclick="filterCommentary('serve')">Serves Only</button>
<button class="px-2.5 py-1 rounded-md bg-slate-900 text-cyan-400 hover:bg-slate-800 border border-cyan-500/30" id="filter-rally" onclick="filterCommentary('rally')">Rallies Only</button>
</div>
<div class="relative w-full sm:w-64">
<input class="w-full px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500" id="commentarySearch" onkeyup="searchCommentary(this.value)" placeholder="Search commentary or strokes..." type="text"/>
</div>
</div>
</div>

<!-- Dynamic Mount Container for Runtime Embedded Match Commentary -->
<div id="commentary-subtab-mount" class="space-y-4">
  <!-- Embedded dynamically via selectCommentaryMatch() at runtime -->
</div>

</section>
